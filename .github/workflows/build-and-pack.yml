name: Build and Package MSI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX (choco)
        shell: powershell
        run: |
          choco install wix -y
          refreshenv

      - name: Prepare signing PFX (optional)
        if: ${{ secrets.SIGNING_PFX_B64 != '' }}
        shell: powershell
        run: |
          Write-Host "Preparing signing PFX from secret"
          $out = Join-Path $Env:GITHUB_WORKSPACE "Installer\signing.pfx"
          $bytes = [System.Convert]::FromBase64String("${{ secrets.SIGNING_PFX_B64 }}")
          [System.IO.File]::WriteAllBytes($out, $bytes)
          echo "SIGNING_PFX=$out" >> $Env:GITHUB_ENV
          echo "SIGNING_PFX_PASS=${{ secrets.SIGNING_PFX_PASS }}" >> $Env:GITHUB_ENV

      - name: Run installer build script
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          Push-Location ${{ github.workspace }}
          .\Installer\Build-Installer.ps1 -ProjectPath "DAISY-Braille Toolkit"
          Pop-Location

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: DAISY-Braille-Toolkit
          path: |
            Installer/DAISY-Braille-Toolkit.msi
            Installer/*.exe

  create_release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: DAISY-Braille-Toolkit

      - name: Create GitHub Release for tag
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            Automated release generated by CI for tag ${{ github.ref_name }}.
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}

      - name: Upload MSI to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: Installer/DAISY-Braille-Toolkit.msi
          asset_name: DAISY-Braille-Toolkit.msi
          asset_content_type: application/octet-stream

      - name: Upload EXE to Release (if present)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: Installer/DAISY-Braille-Toolkit.exe
          asset_name: DAISY-Braille-Toolkit.exe
          asset_content_type: application/octet-stream

name: Release (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore "./DAISY-Braille Toolkit/DAISY-Braille Toolkit.csproj"

      - name: Publish (win-x64, self-contained single-file)
        run: dotnet publish "./DAISY-Braille Toolkit/DAISY-Braille Toolkit.csproj" -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o "./dist/win-x64"

      - name: Zip artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "./out" | Out-Null
          Compress-Archive -Path "./dist/win-x64/*" -DestinationPath "./out/DAISY-Braille-Toolkit-win-x64.zip" -Force

      - name: Create checksums
        shell: pwsh
        run: |
          $zip = "./out/DAISY-Braille-Toolkit-win-x64.zip"
          ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $zip -Leaf)) | Out-File -Encoding ascii "./out/DAISY-Braille-Toolkit-win-x64.zip.sha256"
          ((Get-FileHash $zip -Algorithm SHA512).Hash.ToLower() + "  " + (Split-Path $zip -Leaf)) | Out-File -Encoding ascii "./out/DAISY-Braille-Toolkit-win-x64.zip.sha512"

      - name: Upload artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: DAISY-Braille-Toolkit-win-x64
          path: |
            ./out/DAISY-Braille-Toolkit-win-x64.zip
            ./out/DAISY-Braille-Toolkit-win-x64.zip.sha256
            ./out/DAISY-Braille-Toolkit-win-x64.zip.sha512

      - name: Generate build provenance attestation (zip)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "./out/DAISY-Braille-Toolkit-win-x64.zip"

      - name: Upload to GitHub Release (attach files)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ./out/DAISY-Braille-Toolkit-win-x64.zip
            ./out/DAISY-Braille-Toolkit-win-x64.zip.sha256
            ./out/DAISY-Braille-Toolkit-win-x64.zip.sha512
